<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Management System</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h1>EMS</h1>

          <button
            type="button"
            class="sidebar-close"
            aria-label="Close navigation menu"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <nav aria-label="Main navigation">
          <a href="#dashboard" class="active" aria-current="page">Dashboard</a>
          <a href="#employees">Employees</a>
          <a href="#departments">Departments</a>
          <a href="#attendance">Attendance</a>
          <a href="#leave-management">Leave Management</a>
        </nav>
      </aside>
      <div class="main-content">
        <header class="topbar">
          <button
            type="button"
            class="menu-toggle"
            aria-label="Open navigation menu"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <span aria-hidden="true">&#9776;</span>
          </button>
          <h2>Dashboard</h2>
          <button
            type="button"
            class="btn btn-primary"
            id="add-employee-button"
          >
            Add Employee
          </button>
        </header>
        <main class="dashboard" id="dashboard">
          <section class="stats-grid" aria-label="Employee statistics">
            <article class="stat-card">
              <h3 class="stat-label">Total Employees</h3>
              <p class="stat-value" id="total-employees-count">0</p>
            </article>
            <article class="stat-card">
              <h3 class="stat-label">Active Employees</h3>
              <p class="stat-value" id="active-employees-count">0</p>
            </article>
            <article class="stat-card">
              <h3 class="stat-label">Departments</h3>
              <p class="stat-value" id="departments-count">0</p>
            </article>
            <article class="stat-card">
              <h3 class="stat-label">Employees on Leave</h3>
              <p class="stat-value" id="employees-on-leave-count">0</p>
            </article>
          </section>
          <section class="employee-section">
            <header class="section-header">
              <h3 id="employee-directory-title">Employee Directory</h3>
              <p>View and manage employee records</p>
            </header>
            <div
              class="table-wrapper"
              role="region"
              aria-labelledby="employee-directory-title"
              tabindex="0"
            >
              <table class="employee-table">
                <caption class="visually-hidden">
                  Employee directory
                </caption>
                <thead>
                  <tr>
                    <th scope="col">Employee</th>
                    <th scope="col">Department</th>
                    <th scope="col">Job Title</th>
                    <th scope="col">Status</th>
                    <th scope="col">Start Date</th>
                    <th scope="col">Actions</th>
                  </tr>
                </thead>
                <tbody id="employee-table-body"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>
    <dialog
      id="employee-dialog"
      aria-labelledby="employee-dialog-title"
      class="employee-dialog"
    >
      <form id="employee-form">
        <input type="hidden" id="employee-id" name="employeeId" />
        <header class="dialog-header">
          <h2 id="employee-dialog-title">Add Employee</h2>
          <button
            type="button"
            class="dialog-close"
            id="close-employee-dialog"
            aria-label="Close dialog"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </header>
        <div class="form-fields">
          <div class="form-group">
            <label for="first-name">First name</label>
            <input
              type="text"
              id="first-name"
              name="firstName"
              autocomplete="given-name"
              required
            />
          </div>
          <div class="form-group">
            <label for="last-name">Last name</label>
            <input
              type="text"
              id="last-name"
              name="lastName"
              autocomplete="family-name"
              required
            />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" name="department" required />
          </div>
          <div class="form-group">
            <label for="job-title">Job title</label>
            <input
              type="text"
              id="job-title"
              name="jobTitle"
              autocomplete="organization-title"
              required
            />
          </div>
          <div class="form-group">
            <label for="start-date">Start date</label>
            <input type="date" id="start-date" name="startDate" required />
          </div>
          <div class="form-group">
            <label for="salary">Salary</label>
            <input
              type="number"
              id="salary"
              name="salary"
              min="0"
              step="0.01"
              value="0"
              required
            />
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" required>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="on-leave">On leave</option>
            </select>
          </div>
        </div>
        <p
          class="form-error"
          id="employee-form-error"
          role="alert"
          hidden
        ></p>
        <div class="form-actions">
          <button
            type="button"
            class="btn btn-secondary"
            id="cancel-employee-button"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary" id="save-employee-button">Save Employee</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
